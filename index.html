<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tijn's Burger Place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #4a2c17; --red: #ef476f; --tomato: #e63946; --orange: #ff8c1a; --yellow: #ffd23f;
    --green: #2ec27e; --green-d: #1f9d63; --blue: #3a86ff; --wood: #b5652d; --wood-d: #7d3f15;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { color: var(--ink); font-family: "Baloo 2", "Trebuchet MS", system-ui, sans-serif; font-weight: 800;
    user-select: none; -webkit-user-select: none; overflow-x: hidden;
    background: #ffb84d radial-gradient(ellipse at 50% -10%, #ffe7a3 0, #ffc15e 45%, #ff9f43 100%) fixed; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .18;
    background: radial-gradient(circle, #fff 2.5px, transparent 3px) 0 0 / 34px 34px; }
  #app { max-width: 1240px; margin: 0 auto; padding: 8px 12px 16px; position: relative; }
  svg.art { width: 100%; height: 100%; display: block; overflow: visible; }

  /* ---------- Topbalk ---------- */
  #top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .logo { margin-right: auto; display: flex; align-items: center; gap: 8px; }
  .logo .ic { width: 56px; height: 56px; animation: bob 2.2s ease-in-out infinite; }
  .logo .t { line-height: .9; }
  .logo .t1 { font-size: 17px; color: #fff; text-shadow: 0 2px 0 var(--wood-d); letter-spacing: 1px; }
  .logo .t2 { font-size: 32px; color: #fff; text-shadow: 0 3px 0 var(--tomato), 0 6px 0 var(--wood-d), 0 8px 8px #0003; }
  .pill { background: #fff; border-radius: 99px; height: 52px; padding: 0 16px 0 6px; display: flex; align-items: center; gap: 6px;
    font-size: 26px; box-shadow: 0 5px 0 #d9822b, 0 8px 12px #0002; }
  .pill .ic { width: 42px; height: 42px; }
  #wallet { color: var(--green-d); min-width: 140px; }
  #wallet.pop { animation: pop .35s; }
  .rbtn { width: 52px; height: 52px; border-radius: 50%; border: 0; background: #fff; cursor: pointer; padding: 9px;
    box-shadow: 0 5px 0 #d9822b, 0 8px 12px #0002; font-family: inherit; }
  .rbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #d9822b; }
  #shopBtn { background: var(--green); width: 70px; height: 70px; padding: 13px; box-shadow: 0 5px 0 var(--green-d), 0 8px 12px #0003;
    position: relative; }
  #shopBtn.can { animation: wiggle 2s ease-in-out infinite; }
  #shopBtn .badge { position: absolute; right: -4px; top: -4px; width: 26px; height: 26px; border-radius: 50%; background: var(--tomato);
    color: #fff; font-size: 17px; display: none; place-items: center; box-shadow: 0 2px 0 #0003; }
  #shopBtn.can .badge { display: grid; }

  /* ---------- Wereld ---------- */
  #stage { position: relative; width: 100%; border-radius: 26px; overflow: hidden; border: 5px solid #fff;
    box-shadow: 0 8px 0 var(--wood-d), 0 14px 24px #0003; background: #fff; }
  #world { position: absolute; left: 0; top: 0; width: 1000px; height: 600px; transform-origin: 0 0; }
  .abs { position: absolute; }
  .kwall { left: 0; top: 0; width: 380px; height: 175px;
    background: linear-gradient(90deg, #0000 95%, #d7e3ea 95%) 0 0 / 32px 32px, linear-gradient(#0000 94%, #d7e3ea 94%) 0 0 / 32px 32px, #f4f9fb; }
  .kfloor { left: 0; top: 175px; width: 380px; height: 425px;
    background: repeating-conic-gradient(#e9f1f5 0 25%, #c9d9e2 0 50%) 0 0 / 56px 56px; }
  .dwall { left: 380px; top: 0; width: 620px; height: 175px;
    background: linear-gradient(transparent 70%, #6cc7c0 70%, #6cc7c0 96%, #c0392b 96%),
                repeating-linear-gradient(90deg, #ffefd2 0 26px, #ffe3b8 26px 52px); }
  .dfloor { left: 380px; top: 175px; width: 620px; height: 425px;
    background: repeating-linear-gradient(0deg, #00000014 0 2px, transparent 2px 42px),
                repeating-linear-gradient(90deg, #d99a5b 0 120px, #cf9052 120px 240px); }
  .divider { left: 374px; top: 0; width: 12px; height: 600px; background: linear-gradient(90deg, #8d5a33, #b7794a, #8d5a33); }
  .awning { left: 380px; top: 0; width: 620px; height: 26px; background: repeating-linear-gradient(90deg, var(--tomato) 0 40px, #fff 40px 80px); }
  .hood { top: 0; height: 40px; background: linear-gradient(#adb5bd, #ced4da); border-radius: 0 0 14px 14px; border: 3px solid #868e96; border-top: 0; }
  .pass { left: 380px; top: 190px; width: 58px; height: 400px; border-radius: 10px;
    background: linear-gradient(90deg, #ced4da, #f1f3f5 50%, #adb5bd); border: 3px solid #868e96; }
  .passitem { width: 44px; height: 44px; transition: top .3s; animation: drop .3s; filter: drop-shadow(0 3px 0 #0003); }
  .door { left: 900px; top: 40px; width: 84px; height: 136px; }
  .win { top: 34px; width: 120px; height: 82px; }
  .station { width: 110px; height: 110px; cursor: pointer; }
  .station .ring { position: absolute; left: 50%; top: -18px; width: 46px; height: 46px; transform: translateX(-50%); display: none; z-index: 2; }
  .station.on .ring { display: block; }
  .station .ring .food { position: absolute; inset: 9px; }
  .station:not(.on) .flame { display: none; }
  .flame { animation: flicker .25s infinite alternate; transform-origin: 50% 100%; transform-box: fill-box; }
  .station.locked { filter: grayscale(.8) brightness(1.1); opacity: .65; }
  .lockbadge { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; z-index: 3; }
  .lockbadge .ic { width: 42px; height: 42px; }
  .ptag { display: flex; align-items: center; gap: 3px; background: linear-gradient(#4ee39a, var(--green)); color: #fff; border-radius: 99px;
    padding: 0 10px 0 3px; font-size: 18px; box-shadow: 0 3px 0 var(--green-d); text-shadow: 0 2px 0 #0002; white-space: nowrap; }
  .ptag .ic { width: 22px; height: 22px; }
  .ptag.cant { background: #adb5bd; box-shadow: 0 3px 0 #868e96; }
  .char { width: 74px; height: 138px; pointer-events: none; }
  .char .body { width: 100%; height: 100%; animation: breathe 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
  .char.walk .body { animation: hop .3s ease-in-out infinite; }
  .char.walk .fl { animation: stepL .3s infinite; } .char.walk .fr { animation: stepR .3s infinite; }
  .char .carry { position: absolute; right: -16px; top: 62px; display: flex; flex-direction: column-reverse; }
  .char .carry .ic { width: 38px; height: 38px; margin-top: -22px; filter: drop-shadow(0 3px 0 #0003); }
  .char .carry .plate2 { width: 50px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); margin-top: -10px; }
  .bubble { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: -6px; background: #fff; border-radius: 18px;
    padding: 4px 6px; display: flex; gap: 0; box-shadow: 0 4px 0 #0002; animation: popin .3s; white-space: nowrap; }
  .bubble::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 8px solid transparent; border-top: 10px solid #fff; }
  .bubble .ic { width: 36px; height: 36px; transition: opacity .2s; }
  .bubble .ic.got { opacity: .25; }
  .bubble .pat { position: absolute; left: 8px; right: 8px; bottom: -3px; height: 6px; border-radius: 3px; background: #0002; overflow: hidden; }
  .bubble .pat div { height: 100%; width: 100%; }
  .react { position: absolute; left: 50%; top: -14px; width: 40px; height: 40px; transform: translateX(-50%); animation: popin .4s; }
  .table { width: 122px; height: 78px; pointer-events: none; }
  .chair { width: 72px; height: 69px; pointer-events: none; }
  .onTable { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); display: flex; }
  .onTable .ic { width: 34px; height: 34px; margin: 0 -3px; animation: drop .3s; transition: transform .4s; }
  .coins { width: 96px; height: 80px; cursor: pointer; display: flex; flex-direction: column; align-items: center; animation: popin .4s, bounce 1s .4s ease-in-out infinite; }
  .coins .pile { width: 64px; height: 50px; }
  .coins .amt { background: #fff; color: var(--green-d); border-radius: 99px; padding: 0 10px; font-size: 20px; box-shadow: 0 3px 0 #0002; margin-top: -8px; }
  .zone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    background: repeating-linear-gradient(45deg, #3b2a1fd9 0 22px, #2c1f17d9 22px 44px); border: 4px dashed #ffd23f; border-radius: 14px; }
  .zone .ic { width: 64px; height: 64px; }
  .zone .ptag { font-size: 26px; padding: 2px 16px 2px 4px; } .zone .ptag .ic { width: 32px; height: 32px; }
  .decor { width: 58px; height: 58px; filter: drop-shadow(0 4px 0 #0002); animation: popin .5s; }
  .decor.neon { animation: popin .5s, glow 1.6s infinite; }
  .register { width: 90px; height: 94px; }
  .spark { position: absolute; width: 30px; height: 30px; pointer-events: none; animation: sparkle .6s forwards; z-index: 9999; }

  /* ---------- Menubalk ---------- */
  #menu { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #menu .mi { background: #fff; border-radius: 18px; padding: 4px 10px 4px 4px; display: flex; align-items: center; gap: 4px;
    box-shadow: 0 4px 0 #d9822b; font-size: 18px; animation: popin .4s; }
  #menu .mi .ic { width: 38px; height: 38px; }
  #rotate { display: none; margin: 10px auto 0; width: 70px; height: 70px; opacity: .7; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate { display: block; } }

  /* ---------- Overlays ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10000; padding: 12px; display: flex; align-items: center; justify-content: center;
    background: #3b1f0bcc; animation: fade .2s; }
  .modal { position: relative; width: 100%; max-width: 820px; max-height: 94vh; overflow: auto; text-align: center;
    background: linear-gradient(#fffaf0, #ffefd3); border-radius: 30px; padding: 18px; border: 6px solid #fff;
    box-shadow: 0 10px 0 #d9822b, 0 20px 40px #0005; animation: popin .35s; }
  .modal .hero { width: 120px; height: 120px; margin: -4px auto 0; animation: bob 2s ease-in-out infinite; }
  .modal .title { font-size: 40px; color: #fff; text-shadow: 0 3px 0 var(--tomato), 0 6px 0 var(--wood-d); margin: 4px 0 10px; }
  .modal .head { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 12px; }
  .modal .head .ic { width: 54px; height: 54px; }
  .xbtn { position: absolute; right: 12px; top: 12px; z-index: 2; }
  .stabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 14px; }
  .stabs button { width: 92px; height: 72px; padding: 6px; border: 0; border-radius: 20px; background: #fff; cursor: pointer; box-shadow: 0 5px 0 #e2c597; }
  .stabs button.on { background: linear-gradient(#ffb04d, var(--orange)); box-shadow: 0 5px 0 #d96d00; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
  .card { border: 0; border-radius: 24px; padding: 10px 8px; cursor: pointer; font-family: inherit; position: relative; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 6px; background: #fff; box-shadow: 0 6px 0 #e2c597; }
  .card .pic { width: 92px; height: 92px; position: relative; display: flex; align-items: flex-end; justify-content: center; }
  .card .pic .ic { width: 100%; height: 100%; }
  .card .pic .ic.mini { position: absolute; right: -12px; bottom: -4px; width: 44px; height: 44px; }
  .card .pic .ic.half { width: 64px; height: 100px; }
  .card .eff { display: flex; align-items: center; gap: 3px; min-height: 26px; font-size: 18px; flex-wrap: wrap; justify-content: center; }
  .card .eff .ic { width: 26px; height: 26px; }
  .price { display: flex; align-items: center; gap: 4px; background: linear-gradient(#4ee39a, var(--green)); color: #fff; border-radius: 99px;
    padding: 0 14px 0 4px; font-size: 22px; box-shadow: 0 4px 0 var(--green-d); text-shadow: 0 2px 0 #0002; }
  .price .ic { width: 26px; height: 26px; }
  .card.cant { filter: saturate(.35); opacity: .7; }
  .card.cant .price { background: #adb5bd; box-shadow: 0 4px 0 #868e96; }
  .card.owned { background: #d8f8e3; box-shadow: 0 6px 0 #8fdcae; cursor: default; }
  .card .okmark { width: 38px; height: 38px; }
  .tag { background: var(--yellow); color: var(--ink); border-radius: 99px; padding: 0 9px; font-size: 16px; box-shadow: 0 2px 0 #e0a800; }
  .dots { display: flex; gap: 4px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: #e9ddc8; box-shadow: inset 0 2px 0 #0001; }
  .dots i.on { background: var(--orange); }
  .how { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 6px 0 16px; }
  .how > div { background: #fff; border-radius: 22px; padding: 10px 8px 8px; box-shadow: 0 5px 0 #e2c597; position: relative; }
  .how .n { position: absolute; left: -6px; top: -8px; width: 34px; height: 34px; border-radius: 50%; background: var(--orange);
    color: #fff; font-size: 22px; display: grid; place-items: center; box-shadow: 0 3px 0 #d96d00; }
  .how .pics { display: flex; justify-content: center; align-items: flex-end; height: 86px; gap: 2px; }
  .how .pics .ic { width: 56px; height: 56px; }
  .how .pics .ic.half { width: 48px; height: 86px; }
  .how small { display: block; font-size: 16px; color: #8a6440; }
  .actions { display: flex; gap: 14px; justify-content: center; margin-top: 14px; }
  .big { border: 0; border-radius: 24px; cursor: pointer; width: 130px; height: 76px; padding: 14px; display: grid; place-items: center;
    box-shadow: 0 7px 0 #0003; font-family: inherit; }
  .big:active { transform: translateY(5px); box-shadow: 0 2px 0 #0003; }
  .big.go { background: linear-gradient(#4ee39a, var(--green)); box-shadow: 0 7px 0 var(--green-d); }
  .big.no { background: linear-gradient(#ced4da, #adb5bd); box-shadow: 0 7px 0 #868e96; width: 90px; }

  .fly { position: fixed; z-index: 20000; pointer-events: none; width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6c2, #f0c02a 55%, #c08d0c); box-shadow: 0 2px 0 #0004;
    transition: all .8s cubic-bezier(.5,-0.4,.6,1); }
  .float { position: fixed; z-index: 20000; pointer-events: none; font-size: 32px; color: #fff;
    text-shadow: 0 3px 0 var(--green-d), 0 0 10px #0003; animation: up 1.2s forwards; }
  .confetti { position: fixed; z-index: 15000; pointer-events: none; width: 12px; height: 16px; border-radius: 3px; animation: fall 1.6s ease-in forwards; }

  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes bounce { 50% { transform: translateY(-7px); } }
  @keyframes breathe { 50% { transform: scale(1.02, .98); } }
  @keyframes hop { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
  @keyframes stepL { 50% { transform: translateY(-5px); } }
  @keyframes stepR { 0%,100% { transform: translateY(-5px); } 50% { transform: none; } }
  @keyframes wiggle { 0%,80%,100% { transform: rotate(0); } 86% { transform: rotate(-12deg) scale(1.08); } 93% { transform: rotate(12deg) scale(1.08); } }
  @keyframes popin { from { transform: scale(0); } 70% { transform: scale(1.12); } }
  @keyframes drop { from { transform: translateY(-30px); opacity: 0; } 70% { transform: translateY(3px); } }
  @keyframes pop { 50% { transform: scale(1.18); } }
  @keyframes up { to { transform: translateY(-80px) scale(1.2); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes fall { from { transform: translateY(0) rotate(0); opacity: 1; } to { transform: translateY(320px) rotate(720deg); opacity: 0; } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  @keyframes flicker { from { transform: scaleY(.85); } to { transform: scaleY(1.1); } }
  @keyframes sparkle { from { transform: scale(.3) rotate(0); opacity: 1; } to { transform: scale(1.6) rotate(90deg) translateY(-20px); opacity: 0; } }
  @keyframes glow { 50% { filter: drop-shadow(0 0 10px #ff4fd8) drop-shadow(0 4px 0 #0002); } }
  @keyframes swim { 50% { transform: translateX(6px); } }
  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  .fishy { animation: swim 2s ease-in-out infinite; }

  @media (max-width: 640px) {
    .logo { width: 100%; justify-content: center; margin: 0; }
    .logo .ic { width: 42px; height: 42px; } .logo .t2 { font-size: 26px; } .logo .t1 { font-size: 13px; }
    #top { justify-content: center; gap: 8px; }
    .pill { height: 44px; font-size: 20px; padding: 0 12px 0 4px; } .pill .ic { width: 34px; height: 34px; } #wallet { min-width: 108px; }
    .rbtn { width: 44px; height: 44px; padding: 8px; } #shopBtn { width: 56px; height: 56px; padding: 11px; }
    #stage { border-width: 3px; border-radius: 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="logo"><div class="ic" data-art="burger"></div><div class="t"><div class="t1">TIJN'S</div><div class="t2">Burger Place</div></div></div>
    <div class="pill" id="wallet"><div class="ic" data-art="coin"></div><span id="money">€0</span></div>
    <div class="pill"><div class="ic" data-art="star"></div><span id="stars">3</span></div>
    <button class="rbtn" id="soundBtn"></button>
    <button class="rbtn" id="shopBtn"><span class="badge">!</span><span id="cartIc"></span></button>
  </div>
  <div id="stage"><div id="world"></div></div>
  <div id="menu"></div>
  <div id="rotate"></div>
</div>
<div id="overlay"></div>

<script>
(() => {
  const O = '#4a2c17';
  const svg = (inner, vb = '0 0 100 100') =>
    `<svg class="art" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg"><g stroke="${O}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">${inner}</g></svg>`;
  const shine = d => `<path d="${d}" fill="none" stroke="#fff" stroke-width="4" opacity=".6"/>`;

  const FOOD_ART = {
    burger: () => svg(`
      <rect x="14" y="68" width="72" height="20" rx="10" fill="#f2a541"/>
      <rect x="9" y="56" width="82" height="15" rx="7.5" fill="#7a4526"/>
      <path d="M11 54 H89 L85 60 L76 67 L68 60 L55 69 L44 60 L30 67 L18 60 Z" fill="#ffd23f"/>
      <path d="M7 48 Q13 58 19 48 Q25 58 31 48 Q37 58 43 48 Q49 58 55 48 Q61 58 67 48 Q73 58 79 48 Q85 58 93 48 L93 46 H7 Z" fill="#7ccf4f"/>
      <path d="M9 47 C9 20 30 11 50 11 C70 11 91 20 91 47 Z" fill="#f6a93b"/>
      ${shine('M24 28 Q32 18 46 17')}
      <g fill="#fff6dc" stroke="none"><ellipse cx="38" cy="26" rx="3" ry="2"/><ellipse cx="54" cy="22" rx="3" ry="2"/><ellipse cx="66" cy="30" rx="3" ry="2"/><ellipse cx="48" cy="34" rx="3" ry="2"/><ellipse cx="74" cy="22" rx="2.5" ry="1.8"/><ellipse cx="28" cy="36" rx="2.5" ry="1.8"/></g>`),
    fries: () => svg(`
      <g fill="#ffd23f">
        <rect x="24" y="14" width="10" height="46" rx="3" transform="rotate(-12 29 40)"/>
        <rect x="36" y="8" width="10" height="50" rx="3" transform="rotate(-4 41 36)"/>
        <rect x="48" y="6" width="10" height="52" rx="3" transform="rotate(3 53 36)"/>
        <rect x="60" y="10" width="10" height="48" rx="3" transform="rotate(10 65 36)"/>
        <rect x="42" y="18" width="10" height="40" rx="3" transform="rotate(14 47 40)"/>
      </g>
      <path d="M18 40 Q50 52 82 40 L74 92 H26 Z" fill="#e63946"/>
      <path d="M50 58 l4 9 10 1 -7.5 6.5 2.5 9.5 -9-5 -9 5 2.5-9.5 -7.5-6.5 10-1z" fill="#ffd23f" stroke-width="2.5"/>
      ${shine('M28 50 L32 84')}`),
    cola: () => svg(`
      <path d="M55 26 L62 4 H76" fill="none" stroke="${O}" stroke-width="10"/>
      <path d="M55 26 L62 4 H76" fill="none" stroke="#ff8fab" stroke-width="5"/>
      <path d="M25 30 H75 L68 92 H32 Z" fill="#3a86ff"/>
      <path d="M27.5 50 H72.5 L70.6 68 H29.4 Z" fill="#fff"/>
      <path d="M38 56 q6 -6 12 0 q6 6 12 0" fill="none" stroke="#e63946" stroke-width="4"/>
      <rect x="20" y="22" width="60" height="11" rx="5.5" fill="#e9ecef"/>
      ${shine('M33 38 L37 86')}`),
    popcorn: () => svg(`
      <g fill="#fff6d8"><circle cx="32" cy="36" r="10"/><circle cx="46" cy="28" r="11"/><circle cx="60" cy="30" r="10"/><circle cx="70" cy="38" r="9"/><circle cx="52" cy="18" r="9"/><circle cx="38" cy="22" r="8"/><circle cx="64" cy="20" r="7"/></g>
      <g fill="#ffd23f" stroke="none"><circle cx="44" cy="25" r="3"/><circle cx="62" cy="34" r="2.5"/><circle cx="34" cy="34" r="2.5"/></g>
      <path d="M22 42 H78 L70 94 H30 Z" fill="#fff"/>
      <g fill="#e63946" stroke="none"><path d="M31 42 H41 L40 94 H34 Z"/><path d="M50 42 H60 L57 94 H51 Z" transform="translate(-5 0)"/><path d="M64 42 H74 L69 94 H63 Z" transform="translate(-2 0)"/></g>
      <path d="M22 42 H78 L70 94 H30 Z" fill="none"/>`),

  const sfx = {

    ding:  () => { tone(1320, 0, .12, 'sine', .12); tone(1760, .08, .2, 'sine', .08); },
    plop:  () => { tone(500, 0, .05, 'sine', .14); tone(800, .04, .06, 'sine', .1); },
    coin:  () => { tone(988, 0, .08); tone(1319, .07, .15); },
    kaching: () => { [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * .07, .18, 'triangle', .14)); },
    wrong: () => { tone(240, 0, .18, 'sawtooth', .06); tone(190, .14, .24, 'sawtooth', .06); },
    angry: () => { tone(200, 0, .3, 'sawtooth', .06); tone(140, .25, .4, 'sawtooth', .06); },
    hello: () => { tone(523, 0, .1, 'sine', .14); tone(784, .1, .15, 'sine', .14); },
    buy:   () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .08, .2, 'triangle', .12)); },
  };

  // ---------------- Effecten ----------------
  function confetti(n = 24) {
    const cols = ['#ef476f', '#ffd23f', '#2ec27e', '#3a86ff', '#9b5de5', '#ff8c1a'];
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div'); d.className = 'confetti'; d.style.background = pick(cols);
      d.style.left = (Math.random() * innerWidth) + 'px'; d.style.top = (Math.random() * 140 - 20) + 'px';
      d.style.animationDelay = (Math.random() * .3) + 's'; if (Math.random() < .4) d.style.borderRadius = '50%';
      document.body.appendChild(d); setTimeout(() => d.remove(), 2000);
    }
  }
  function floatAt(el, text) {
    const r = el.getBoundingClientRect();
    const d = document.createElement('div'); d.className = 'float'; d.textContent = text;
    d.style.left = (r.left + r.width / 2 - 36) + 'px'; d.style.top = r.top + 'px';
    document.body.appendChild(d); setTimeout(() => d.remove(), 1200);
  }
  function flyToWallet(fromEl, count = 6) {
    const a = fromEl.getBoundingClientRect(), b = $('wallet').getBoundingClientRect();
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div'); d.className = 'fly';
      d.style.left = (a.left + Math.random() * a.width) + 'px'; d.style.top = (a.top + Math.random() * a.height) + 'px';
      document.body.appendChild(d);
      setTimeout(() => { d.style.left = (b.left + 14) + 'px'; d.style.top = (b.top + 10) + 'px'; d.style.transform = 'scale(.6)'; }, 30 + i * 60);
      setTimeout(() => d.remove(), 950 + i * 60);
    }
    setTimeout(() => { const w = $('wallet'); w.classList.remove('pop'); void w.offsetWidth; w.classList.add('pop'); }, 800);
  }
  function spark(x, y) {
    const d = mk('spark', art('star'), x - 15, y - 15, 9999); d.className = 'spark';
    setTimeout(() => d.remove(), 600);
  }

  // =====================================================================
  //  WERELD OPBOUWEN
  // =====================================================================
  let tables = [], cooks = [], waiters = [], cashiers = [], customers = [], tickets = [], ready = [];
  let stationEls = {}, zoneEls = [], passEl;

  function fit() {
    const st = $('stage'), w = st.clientWidth, s = w / 1000;
    W.style.transform = `scale(${s})`; st.style.height = (600 * s) + 'px';
  }

  function buildStatic() {
    W.innerHTML = '';
    mk('kwall', '', 0, 0, 0); mk('kfloor', '', 0, 175, 0); mk('dwall', '', 380, 0, 0); mk('dfloor', '', 380, 175, 0); mk('awning', '', 380, 0, 2);
    mk('hood', '', 10, 0, 2).style.width = '360px';
    mk('win', art('window'), 470, 34, 1); mk('win', art('window'), 696, 34, 1);
    mk('door', art('door'), 900, 40, 1).style.zIndex = 1;
    mk('divider', '', 374, 0, 3);
    passEl = mk('pass', '', 380, 190, 150);
    const reg = mk('register', art('register'), 905, 300, 360); reg.title = '';
  }

  function placeCharEl(ch) {
    ch.el.style.transform = `translate(${ch.x - 37}px, ${ch.y - 138}px)`;
    ch.el.style.zIndex = Math.round(ch.y);
  }
  function makeChar(look, x, y) {
    const el = mk('char', `<div class="body">${animalSVG(look, look.mood || 'ok')}</div>`, 0, 0);
    const ch = { look, x, y, el, path: [] };
    placeCharEl(ch);
    return ch;
  }
  function setLook(ch, mood) {
    if (ch.look.mood === mood) return;
    ch.look.mood = mood; ch.el.querySelector('.body').innerHTML = animalSVG(ch.look, mood);
  }
  const KIND_KEYS = Object.keys(KINDS);
  const staffLook = role => {
    let kind = pick(KIND_KEYS.filter(k => role !== 'cook' || !['rabbit', 'frog', 'lion'].includes(k)));
    const shirt = role === 'cook' ? '#ffffff' : role === 'waiter' ? '#2b2d42' : '#2ec27e';
    return { kind, shirt, role, acc: role === 'cashier' ? 'cap' : 'none', cap: '#ef476f', blink: (Math.random() * 4).toFixed(2), feet: role === 'waiter', mood: 'happy' };
  };

  function buildStations() {
    for (const k of ST_KEYS) {
      const p = STATIONS[k];
      if (stationEls[k]) stationEls[k].remove();
      const el = mk('station' + (owned(k) ? '' : ' locked'), art(k), p.x, p.y, p.y + 110);
      el.innerHTML += `<div class="ring"><svg class="art" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fff" stroke="#4a2c17" stroke-width="5"/><circle class="prog" cx="50" cy="50" r="38" fill="none" stroke="#2ec27e" stroke-width="12" stroke-dasharray="239" stroke-dashoffset="239" transform="rotate(-90 50 50)"/></svg><div class="food"></div></div>`;
      if (!owned(k)) {
        el.innerHTML += `<div class="lockbadge">${ic('lock')}${ptag(STATIONS[k].cost)}</div>`;
        el.querySelector('svg.art').style.opacity = .5;
      }
      el.onclick = () => stationTap(k, el);
      stationEls[k] = el;
    }
  }

  function syncCooks() {
    for (const k of ST_KEYS) {
      const want = owned(k) ? S.st[k].cooks : 0;
      let mine = cooks.filter(c => c.st === k);
      while (mine.length < want) {
        const c = makeChar(staffLook('cook'), 0, 0); c.st = k; c.job = null; cooks.push(c); mine.push(c);
      }
      mine.forEach((c, i) => {
        const p = STATIONS[k], n = mine.length;
        c.x = p.x + 55 + (n === 1 ? 0 : (i - (n - 1) / 2) * 36); c.y = p.y + 48;
        placeCharEl(c);
      });
    }
  }
  function syncWaiters() {
    while (waiters.length < S.waiters) {
      const i = waiters.length, home = [458, 236 + i * 64];
      const w = makeChar(staffLook('waiter'), home[0], home[1]);
      w.home = home; w.state = 'idle'; w.carry = []; waiters.push(w);
      w.carryEl = document.createElement('div'); w.carryEl.className = 'carry'; w.el.appendChild(w.carryEl);
    }
  }
  function syncCashiers() {
    while (cashiers.length < S.cashiers) {
      const c = makeChar(staffLook('cashier'), 950 - cashiers.length * 40, 330); c.t = 0; cashiers.push(c);
    }
  }
  function syncTables() {
    while (tables.length < S.tables) {
      const i = tables.length, [x, y] = SLOTS[i];
      const t = { i, x, y, cust: null, coins: 0, dishes: [] };
      t.chair = mk('chair', art('chair'), x - 36, y - 88, y - 60);
      t.el = mk('table', art('table'), x - 61, y - 36, y + 46);
      t.dishEl = document.createElement('div'); t.dishEl.className = 'onTable'; t.el.appendChild(t.dishEl);
      tables.push(t);
    }
  }
  function buildZones() {
    zoneEls.forEach(z => z.remove()); zoneEls = [];
    for (let l = S.level + 1; l < ZONES.length; l++) {
      const z = ZONES[l];
      const el = mk('zone', `${ic('lock')}${ptag(LEVEL_COST[l])}`, z.x, z.y, 2000);
      el.style.width = z.w + 'px'; el.style.height = z.h + 'px';
      if (l > S.level + 1) { el.style.opacity = .85; el.innerHTML = ic('lock'); }
      el.onclick = () => { if (l === S.level + 1) buyLevel(l, el); };
      zoneEls.push(el);
    }
  }
  let decorEls = [];
  function buildDecor() {
    decorEls.forEach(d => d.remove()); decorEls = [];
    for (const k in S.decor) { const d = DECOR[k]; decorEls.push(mk('decor' + (k === 'neon' ? ' neon' : ''), art(k), d.x, d.y, 5)); }
  }
  function renderMenu() {
    $('menu').innerHTML = menu().map(k => `<div class="mi">${ic(k)}<span class="tag">${fmt(FOODS[k].price)}</span></div>`).join('');
  }
  function renderPass() {
    passEl.innerHTML = '';
    ready.filter(d => !d.taken).slice(0, 9).forEach((d, i) => {
      const e = document.createElement('div'); e.className = 'abs passitem'; e.innerHTML = art(d.item);
      e.style.left = '4px'; e.style.top = (6 + i * 42) + 'px'; passEl.appendChild(e);
    });
  }
  function renderBubble(c) {
    let b = c.el.querySelector('.bubble');
    if (c.state !== 'wait') { if (b) b.remove(); return; }
    if (!b) { b = document.createElement('div'); b.className = 'bubble'; c.el.appendChild(b); b.style.top = '10px'; b.style.bottom = 'auto'; b.style.transform = 'translate(-50%,-100%)'; }
    const got = c.got.slice();
    b.innerHTML = c.order.map(k => { const i = got.indexOf(k), g = i >= 0; if (g) got.splice(i, 1); return `<div class="ic ${g ? 'got' : ''}">${art(k)}</div>`; }).join('') + '<div class="pat"><div></div></div>';
  }
  function renderTable(t) {
    t.dishEl.innerHTML = t.dishes.map(k => `<div class="ic">${art(k)}</div>`).join('');
    if (t.coinEl) { t.coinEl.remove(); t.coinEl = null; }
    if (t.coins) {
      t.coinEl = mk('coins', `<div class="pile">${art('pile')}</div><div class="amt">${fmt(t.coins)}</div>`, t.x - 48, t.y - 66, 3000);
      t.coinEl.onclick = e => { e.stopPropagation(); collect(t); };
    }
  }
  function updateTop() {
    $('money').textContent = fmt(S.money); $('stars').textContent = S.stars.toFixed(1);
    $('shopBtn').classList.toggle('can', cheapest() <= S.money);
    zoneEls.forEach(z => z.querySelectorAll('.ptag').forEach(p => p.classList.toggle('cant', S.money < LEVEL_COST[S.level + 1])));
    for (const k of ST_KEYS) if (!owned(k)) { const p = stationEls[k].querySelector('.ptag'); if (p) p.classList.toggle('cant', S.money < STATIONS[k].cost); }
  }

  // =====================================================================
  //  SPELREGELS
  // =====================================================================
  const freeTable = () => tables.find(t => !t.cust && !t.coins && t.i < LEVEL_SLOTS[S.level]);
  const spawnEvery = () => Math.max(1.6, 8 / (1 + .3 * S.ads + Object.keys(S.decor).length * .05) * (1.4 - S.stars * .1));
  const walkSpeed = () => 150;
  const waiterSpeed = () => 170 * (1 + .35 * S.skates);
  let spawnT = 1;

  function moveTo(ch, x, y) { ch.tx = x; ch.ty = y; ch.el.classList.add('walk'); }
  function stepMove(ch, dt, speed) {
    if (ch.tx == null) return true;
    const dx = ch.tx - ch.x, dy = ch.ty - ch.y, d = Math.hypot(dx, dy), s = speed * dt;
    if (d <= s) { ch.x = ch.tx; ch.y = ch.ty; ch.tx = null; ch.el.classList.remove('walk'); placeCharEl(ch); return true; }
    ch.x += dx / d * s; ch.y += dy / d * s; placeCharEl(ch); return false;
  }

  function spawnCustomer() {
    const t = freeTable(); if (!t) return;
    const m = menu(), maxN = Math.min(3, 1 + Math.floor(Object.keys(S.st).length / 2));
    const n = 1 + Math.floor(Math.random() * maxN);
    const order = []; for (let i = 0; i < n; i++) order.push(pick(m));
    let kind = pick(KIND_KEYS), acc = pick(ACCS); if (acc === 'cap' && ['rabbit', 'frog', 'lion'].includes(kind)) acc = 'none';
    const look = { kind, shirt: pick(SHIRTS), cap: pick(SHIRTS), acc, blink: (Math.random() * 4).toFixed(2), feet: true, mood: 'happy' };
    const c = makeChar(look, 942, 182);
    Object.assign(c, { order, got: [], table: t, state: 'enter', pat: 0, max: 40 + n * 12 });
    t.cust = c; customers.push(c);
    moveTo(c, 942, 230);
    c.path = [[t.x, t.y + 10]];
    sfx.hello();
  }

  function removeCustomer(c) {
    c.el.remove(); customers = customers.filter(x => x !== c);
  }

  function update(dt) {
    // klanten komen binnen
    spawnT -= dt;
    if (spawnT <= 0) { spawnCustomer(); spawnT = spawnEvery() * (.7 + Math.random() * .6); }

    for (const c of customers.slice()) {
      if (c.state === 'enter') {
        if (stepMove(c, dt, walkSpeed())) {
          if (c.path.length) { const [x, y] = c.path.shift(); moveTo(c, x, y); }
          else {
            c.state = 'wait'; c.look.feet = false; c.look.mood = ''; setLook(c, 'ok');
            c.pat = c.max; c.order.forEach(item => tickets.push({ item, cust: c }));
            renderBubble(c); sfx.plop();
          }
        }
      } else if (c.state === 'wait') {
        c.pat -= dt;
        const p = c.pat / c.max, bar = c.el.querySelector('.pat div');
        if (bar) { bar.style.width = Math.max(0, p * 100) + '%'; bar.style.background = p > .5 ? '#2ec27e' : p > .25 ? '#ffc21a' : '#e63946'; }
        if (p < .25) setLook(c, 'angry'); else if (p < .5) setLook(c, 'worried');
        if (c.got.length === c.order.length) {
          c.state = 'eat'; c.eat = 4; setLook(c, 'happy'); renderBubble(c);
        } else if (c.pat <= 0) {
          sfx.angry(); S.stars = Math.max(1, S.stars - .25);
          tickets = tickets.filter(tk => tk.cust !== c); ready = ready.filter(d => d.cust !== c || d.taken); renderPass();
          leave(c, false);
        }
      } else if (c.state === 'eat') {
        c.eat -= dt;
        c.table.dishEl.querySelectorAll('.ic').forEach(e => e.style.transform = `scale(${Math.max(.2, c.eat / 4)})`);
        if (c.eat <= 0) {
          const total = c.order.reduce((s, k) => s + FOODS[k].price, 0);
          const frac = c.pat / c.max, tip = frac > .6 ? 100 : frac > .3 ? 50 : 0;
          c.table.coins = total + tip; c.table.dishes = []; renderTable(c.table);
          S.served++; S.stars = Math.min(5, S.stars + .06); updateTop(); sfx.ding();
          leave(c, true);
        }
      } else if (c.state === 'leave') {
        if (c.delay > 0) {
          c.delay -= dt;
          if (c.delay <= 0) {
            const t = c.table; t.cust = null; if (!c.happy) { t.dishes = []; renderTable(t); }
            c.look.feet = true; c.look.mood = ''; setLook(c, c.happy ? 'love' : 'angry');
            moveTo(c, 942, 230); c.path = [[942, 182]];
          }
          continue;
        }
        if (stepMove(c, dt, walkSpeed())) {
          if (c.path.length) { const [x, y] = c.path.shift(); moveTo(c, x, y); } else removeCustomer(c);
        }
      }
    }

    // koks
    for (const k of cooks) {
      if (!k.job) {
        const i = tickets.findIndex(tk => FOODS[tk.item].st === k.st);
        if (i >= 0) {
          const tk = tickets.splice(i, 1)[0];
          const dur = FOODS[tk.item].time * Math.pow(.75, S.st[k.st].speed);
          k.job = { ...tk, t: dur, dur }; k.el.classList.add('walk');
        }
      } else {
        k.job.t -= dt;
        if (k.job.t <= 0) {
          if (k.job.cust.state === 'wait') { ready.push({ item: k.job.item, cust: k.job.cust }); renderPass(); sfx.plop(); }
          k.job = null; k.el.classList.remove('walk');
        }
      }
    }
    // stations tonen voortgang
    for (const st of ST_KEYS) {
      if (!owned(st)) continue;
      const busy = cooks.filter(c => c.st === st && c.job);
      const el = stationEls[st];
      el.classList.toggle('on', busy.length > 0);
      if (busy.length) {
        const j = busy[0].job;
        el.querySelector('.prog').setAttribute('stroke-dashoffset', 239 * (j.t / j.dur));
        const f = el.querySelector('.ring .food');
        if (f.dataset.k !== j.item) { f.dataset.k = j.item; f.innerHTML = art(j.item); }
      }
    }

    // obers
    for (const w of waiters) {
      const arrived = stepMove(w, dt, waiterSpeed());
      if (!arrived) continue;
      if (w.state === 'idle') {
        const d = ready.find(r => !r.taken && r.cust.state === 'wait');
        if (d) {
          const batch = ready.filter(r => !r.taken && r.cust === d.cust).slice(0, 3);
          batch.forEach(r => r.taken = true); w.batch = batch; w.cust = d.cust;
          w.state = 'toPass'; moveTo(w, 458, Math.min(560, 210 + ready.indexOf(d) * 42));
        } else if (w.x !== w.home[0] || w.y !== w.home[1]) moveTo(w, w.home[0], w.home[1]);
      } else if (w.state === 'toPass') {
        ready = ready.filter(r => !w.batch.includes(r)); renderPass();
        w.carry = w.batch.map(r => r.item);
        w.carryEl.innerHTML = '<div class="plate2"></div>' + w.carry.map(k => `<div class="ic">${art(k)}</div>`).join('');
        if (w.cust.state !== 'wait') { w.carry = []; w.carryEl.innerHTML = ''; w.state = 'idle'; continue; }
        const t = w.cust.table; w.state = 'toTable'; moveTo(w, t.x + 72, t.y + 44);
      } else if (w.state === 'toTable') {
        const c = w.cust;
        if (c.state === 'wait') {
          c.got.push(...w.carry); c.table.dishes.push(...w.carry); renderTable(c.table); renderBubble(c); sfx.plop();
        }
        w.carry = []; w.carryEl.innerHTML = ''; w.state = 'idle'; w.cust = null;
      }
    }

    // kassamedewerkers halen geld op
    for (const c of cashiers) {
      c.t += dt;
      if (c.t > 3.5) {
        const t = tables.find(t => t.coins);
        if (t) { c.t = 0; collect(t, true); }
      }
    }
  }

  function leave(c, happy) {
    c.state = 'leave'; c.happy = happy; c.delay = .8; c.tx = null; c.path = []; renderBubble(c);
    setLook(c, happy ? 'love' : 'angry');
    const r = document.createElement('div'); r.className = 'react'; r.innerHTML = art(happy ? 'heart' : 'angry'); c.el.appendChild(r);
  }

  function collect(t, auto) {
    if (!t.coins) return;
    const v = t.coins; t.coins = 0;
    S.money += v; save();
    if (t.coinEl) { flyToWallet(t.coinEl, 6); floatAt(t.coinEl, '+' + fmt(v)); }
    sfx.kaching();
    renderTable(t); updateTop();
  }

  function stationTap(k, el) {
    if (!owned(k)) {
      const c = STATIONS[k].cost;
      if (S.money < c) { sfx.wrong(); return; }
      S.money -= c; S.st[k] = { cooks: 1, speed: 0 }; afterBuy();
      return;
    }
    const busy = cooks.filter(c => c.st === k && c.job);
    if (!busy.length) return;
    busy.forEach(c => c.job.t -= c.job.dur * .18);
    sfx.tap(); spark(STATIONS[k].x + 30 + Math.random() * 50, STATIONS[k].y + 20 + Math.random() * 40);
  }
  function buyLevel(l) {
    const c = LEVEL_COST[l];
    if (S.money < c) { sfx.wrong(); return; }
    S.money -= c; S.level = l; afterBuy();
  }
  function afterBuy() {
    sfx.buy(); confetti(30); save();
    buildStations(); syncCooks(); syncWaiters(); syncCashiers(); syncTables(); buildZones(); buildDecor(); renderMenu(); updateTop();
  }

  // =====================================================================
  //  WINKEL
  // =====================================================================
  function shopItems() {
    const L = { people: [], kitchen: [], room: [] };
    // mensen
    for (const k of ST_KEYS) if (owned(k)) {
      const n = S.st[k].cooks, max = n >= 2;
      L.people.push({ pic: `<div class="ic half">${art('chef')}</div><div class="ic mini">${art(k)}</div>`, eff: dots(n, 2), cost: max ? 0 : COOK_COST(k, n), done: max, buy: () => S.st[k].cooks++ });
    }
    L.people.push({ pic: `<div class="ic half">${art('waiterIc')}</div>`, eff: dots(S.waiters, WAITER_COSTS.length), cost: WAITER_COSTS[S.waiters] || 0, done: S.waiters >= WAITER_COSTS.length, buy: () => S.waiters++ });
    L.people.push({ pic: `<div class="ic half">${art('cashierIc')}</div><div class="ic mini">${art('pile')}</div>`, eff: dots(S.cashiers, CASHIER_COSTS.length), cost: CASHIER_COSTS[S.cashiers] || 0, done: S.cashiers >= CASHIER_COSTS.length, buy: () => S.cashiers++ });
    L.people.push({ pic: ic('skates'), eff: dots(S.skates, SKATE_COSTS.length), cost: SKATE_COSTS[S.skates] || 0, done: S.skates >= SKATE_COSTS.length, buy: () => S.skates++ });
    // keuken
    for (const k of ST_KEYS) {
      const foods = Object.keys(FOODS).filter(f => FOODS[f].st === k).map(f => ic(f)).join('');
      if (!owned(k)) L.kitchen.push({ pic: ic(k), eff: foods, cost: STATIONS[k].cost, done: false, buy: () => S.st[k] = { cooks: 1, speed: 0 } });
      else {
        const sp = S.st[k].speed, max = sp >= SPEED_COSTS.length;
        L.kitchen.push({ pic: `${ic(k)}<div class="ic mini">${art('bolt')}</div>`, eff: dots(sp, SPEED_COSTS.length), cost: max ? 0 : SPEED_COSTS[sp] * (1 + ST_KEYS.indexOf(k) * .5), done: max, buy: () => S.st[k].speed++ });
      }
    }
    // restaurant
    const maxT = LEVEL_SLOTS[S.level];
    L.room.push({ pic: ic('table'), eff: dots(S.tables, maxT), cost: S.tables < maxT ? TABLE_COST(S.tables) : 0, done: S.tables >= maxT, buy: () => S.tables++ });
    if (S.level < 2) L.room.push({ pic: `${ic('house')}<div class="ic mini">${art('up')}</div>`, eff: dots(S.level + 1, 3), cost: LEVEL_COST[S.level + 1], done: false, buy: () => S.level++ });
    L.room.push({ pic: ic('megaphone'), eff: dots(S.ads, ADS_COSTS.length), cost: ADS_COSTS[S.ads] || 0, done: S.ads >= ADS_COSTS.length, buy: () => S.ads++ });
    for (const k in DECOR) L.room.push({ pic: ic(k), eff: '', cost: DECOR[k].cost, done: !!S.decor[k], buy: () => S.decor[k] = 1 });
    return L;
  }
  const dots = (n, max) => `<span class="dots">${Array.from({ length: max }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
  function cheapest() {
    const L = shopItems(); let m = Infinity;
    for (const t in L) for (const it of L[t]) if (!it.done && it.cost < m) m = it.cost;
    return m;
  }

  let shopTab = 'people', paused = false;
  const overlay = html => { $('overlay').innerHTML = `<div class="overlay"><div class="modal">${html}</div></div>`; };
  const closeOverlay = () => { $('overlay').innerHTML = ''; };
  function openShop() { paused = true; renderShop(); }
  function renderShop() {
    overlay(`
      <button class="rbtn xbtn" id="closeShop">${art('close')}</button>
      <div class="head"><div class="ic">${art('coin')}</div><span style="font-size:38px;color:var(--green-d)">${fmt(S.money)}</span></div>
      <div class="stabs">
        <button data-t="people" class="${shopTab === 'people' ? 'on' : ''}">${art('people')}</button>
        <button data-t="kitchen" class="${shopTab === 'kitchen' ? 'on' : ''}">${art('grill')}</button>
        <button data-t="room" class="${shopTab === 'room' ? 'on' : ''}">${art('table')}</button>
      </div>
      <div class="grid" id="shopGrid"></div>`);
    const g = $('shopGrid');
    for (const it of shopItems()[shopTab]) {
      const b = document.createElement('button');
      b.className = 'card' + (it.done ? ' owned' : S.money < it.cost ? ' cant' : '');
      b.innerHTML = `<div class="pic">${it.pic}</div><div class="eff">${it.eff}</div>${it.done ? `<div class="okmark">${art('checkG')}</div>` : `<span class="price">${ic('coin')}${fmt(it.cost)}</span>`}`;
      b.onclick = () => {
        if (it.done) return;
        if (S.money < it.cost) { sfx.wrong(); b.animate([{ transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'none' }], 300); return; }
        S.money -= it.cost; it.buy(); afterBuy(); renderShop();
      };
      g.appendChild(b);
    }
    document.querySelectorAll('.stabs button').forEach(b => b.onclick = () => { shopTab = b.dataset.t; sfx.tap(); renderShop(); });
    $('closeShop').onclick = () => { sfx.tap(); closeOverlay(); paused = false; last = performance.now(); };
  }

  function help() {
    paused = true;
    const cust = { kind: 'bear', shirt: '#3a86ff', acc: 'none', blink: 0 };
    overlay(`
      <div class="hero">${art('burger')}</div>
      <div class="title">Tijn's Burger Place</div>
      <div class="how">
        <div><span class="n">1</span><div class="pics"><div class="ic half">${animalSVG(cust, 'happy')}</div>${ic('table')}</div><small>Klanten gaan zitten</small></div>
        <div><span class="n">2</span><div class="pics"><div class="ic half">${art('chef')}</div>${ic('grill')}</div><small>Koks maken het eten</small></div>
        <div><span class="n">3</span><div class="pics"><div class="ic half">${art('waiterIc')}</div>${ic('burger')}</div><small>Obers brengen het</small></div>
        <div><span class="n">4</span><div class="pics">${ic('tap')}${ic('pile')}</div><small>Tik op het geld!</small></div>
        <div><span class="n">5</span><div class="pics"><div class="ic" style="background:var(--green);border-radius:50%;padding:10px">${art('cart')}</div>${ic('house')}</div><small>Koop mensen en uitbreidingen</small></div>
      </div>
      <div class="actions">
        ${S.served ? `<button class="big no" id="resetBtn">${art('reset')}</button>` : ''}
        <button class="big go" id="startBtn">${art('play')}</button>
      </div>`);
    $('startBtn').onclick = () => { S.seenHelp = true; save(); closeOverlay(); paused = false; last = performance.now(); sfx.hello(); };
    const r = $('resetBtn');
    if (r) r.onclick = () => {
      overlay(`<div class="hero">${art('reset')}</div><div class="actions">
        <button class="big no" id="rNo">${art('close')}</button><button class="big go" id="rYes">${art('check')}</button></div>`);
      $('rNo').onclick = help;
      $('rYes').onclick = () => { const snd = S.sound; S = fresh(); S.sound = snd; save(); location.reload(); };
    };
  }

  // =====================================================================
  //  START
  // =====================================================================
  document.querySelectorAll('[data-art]').forEach(e => e.innerHTML = art(e.dataset.art));
  $('cartIc').innerHTML = art('cart');
  $('rotate').innerHTML = art('rotate');
  const setSoundIcon = () => $('soundBtn').innerHTML = art(S.sound ? 'soundOn' : 'soundOff');
  setSoundIcon();
  $('soundBtn').onclick = () => { S.sound = !S.sound; setSoundIcon(); save(); sfx.tap(); };
  $('shopBtn').onclick = () => { sfx.tap(); openShop(); };
  $('top').querySelector('.logo').onclick = help;

  buildStatic(); buildStations(); syncCooks(); syncWaiters(); syncCashiers(); syncTables(); buildZones(); buildDecor(); renderMenu(); updateTop();
  fit(); addEventListener('resize', fit);
  setInterval(save, 5000);

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (!paused) update(dt);
    requestAnimationFrame(loop);
  }
  help();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
